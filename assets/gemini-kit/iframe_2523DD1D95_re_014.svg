<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <!-- 底部柔和投影 -->
  <ellipse cx="25" cy="43.5" rx="15" ry="2.2" fill="${isActive ? '#DCD2FF' : '#EAE6F5'}" />
  <!-- 书本主体 -->
  <rect x="10" y="6" width="29" height="35" rx="7" fill="${coverFill}" stroke="${t.stroke}" stroke-width="${sw}" stroke-linejoin="round"/>
  <!-- 书脊分界装饰带 -->
  <path d="M16.5 6V41" stroke="${t.stroke}" stroke-width="${sw}" stroke-linecap="round"/>
  <!-- 顶部小鹿红领巾同色书签飘带 -->
  <path d="M28 6V15.5L31.5 13L35 15.5V6" fill="${ribbonFill}" stroke="${t.stroke}" stroke-width="${Math.max(2.2, sw - 0.4)}" stroke-linejoin="round"/>
  <!-- 左侧三个Q版活页线圈 -->
  <path d="M7.5 13.5H12.5" stroke="${t.stroke}" stroke-width="${sw}" stroke-linecap="round"/>
  <path d="M7.5 23.5H12.5" stroke="${t.stroke}" stroke-width="${sw}" stroke-linecap="round"/>
  <path d="M7.5 33.5H12.5" stroke="${t.stroke}" stroke-width="${sw}" stroke-linecap="round"/>
  <!-- 中心错题本圆章贴纸 -->
  <circle cx="27.5" cy="26" r="7.5" fill="${badgeFill}" stroke="${t.stroke}" stroke-width="${sw}"/>
  <!-- 错题叉号标记 -->
  <path d="M25 23.5L30 28.5M30 23.5L25 28.5" stroke="${t.stroke}" stroke-width="${Math.max(2.4, sw - 0.3)}" stroke-linecap="round"/>
  ${isActive ? `<!-- 右上角小鹿高光星点 -->
  <circle cx="35.5" cy="35.5" r="1.8" fill="#FFFFFF"/>` : ''}
</svg>