<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- 小赵 · 紫色小鹿（参考：金角红领巾大眼小鹿） -->
  <defs>
    <linearGradient id="dzBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3a2f7"/>
      <stop offset="1" stop-color="#8f7bee"/>
    </linearGradient>
    <linearGradient id="dzHorn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbc64e"/>
      <stop offset="1" stop-color="#f0a92e"/>
    </linearGradient>
  </defs>

  <!-- 地面影子 -->
  <ellipse cx="160" cy="298" rx="82" ry="12" fill="#5b3fd6" opacity=".15"/>

  <!-- ============ 鹿角（金色，带头盔小圆点） ============ -->
  <g stroke="#3a2e5c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="url(#dzHorn)">
    <!-- 左角 -->
    <path d="M118 62 C 108 40 112 22 128 10 C 130 22 136 30 146 34" fill="none"/>
    <path d="M124 34 C 116 28 110 20 110 12" fill="none"/>
    <!-- 右角 -->
    <path d="M202 62 C 212 40 208 22 192 10 C 190 22 184 30 174 34" fill="none"/>
    <path d="M196 34 C 204 28 210 20 210 12" fill="none"/>
  </g>
  <circle cx="128" cy="10" r="6" fill="#fbc64e" stroke="#3a2e5c" stroke-width="6"/>
  <circle cx="192" cy="10" r="6" fill="#fbc64e" stroke="#3a2e5c" stroke-width="6"/>

  <!-- ============ 耳朵 ============ -->
  <g stroke="#3a2e5c" stroke-width="7" stroke-linejoin="round">
    <path d="M78 78 C 56 62 44 68 40 84 C 52 100 68 104 84 98 Z" fill="#9f8cf2"/>
    <path d="M70 86 C 62 80 56 80 52 86 C 58 92 66 94 72 92 Z" fill="#e6dcff" stroke-width="0"/>
    <path d="M242 78 C 264 62 276 68 280 84 C 268 100 252 104 236 98 Z" fill="#9f8cf2"/>
    <path d="M250 86 C 258 80 264 80 268 86 C 262 92 254 94 248 92 Z" fill="#e6dcff" stroke-width="0"/>
  </g>

  <!-- ============ 身体（头后面） ============ -->
  <path d="M160 196
           C 214 196 238 226 238 258
           C 238 284 208 296 160 296
           C 112 296 82 284 82 258
           C 82 226 106 196 160 196 Z"
        fill="url(#dzBody)" stroke="#3a2e5c" stroke-width="7" stroke-linejoin="round"/>
  <!-- 肚皮 -->
  <path d="M160 214 C 190 214 206 232 206 256 C 206 274 188 284 160 284 C 132 284 114 274 114 256 C 114 232 130 214 160 214 Z"
        fill="#f3efff" stroke="none"/>
  <!-- 背上白点 -->
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="112" cy="232" rx="5" ry="3.4" transform="rotate(-20 112 232)"/>
    <ellipse cx="128" cy="222" rx="5" ry="3.4" transform="rotate(-12 128 222)"/>
    <ellipse cx="192" cy="222" rx="5" ry="3.4" transform="rotate(12 192 222)"/>
    <ellipse cx="208" cy="232" rx="5" ry="3.4" transform="rotate(20 208 232)"/>
    <ellipse cx="146" cy="216" rx="4.4" ry="3" />
    <ellipse cx="176" cy="216" rx="4.4" ry="3" />
  </g>
  <!-- 前腿 -->
  <g stroke="#3a2e5c" stroke-width="7" stroke-linejoin="round">
    <rect x="122" y="272" width="26" height="26" rx="11" fill="#9f8cf2"/>
    <rect x="172" y="272" width="26" height="26" rx="11" fill="#9f8cf2"/>
  </g>
  <g fill="#4a3d78">
    <rect x="122" y="284" width="26" height="14" rx="7"/>
    <rect x="172" y="284" width="26" height="14" rx="7"/>
  </g>

  <!-- ============ 头 ============ -->
  <path d="M160 44
           C 216 44 250 84 250 134
           C 250 178 210 202 160 202
           C 110 202 70 178 70 134
           C 70 84 104 44 160 44 Z"
        fill="url(#dzBody)" stroke="#3a2e5c" stroke-width="7" stroke-linejoin="round"/>

  <!-- 额头白点 -->
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="160" cy="62" rx="5.5" ry="4"/>
    <ellipse cx="146" cy="74" rx="4.6" ry="3.4" transform="rotate(-16 146 74)"/>
    <ellipse cx="174" cy="74" rx="4.6" ry="3.4" transform="rotate(16 174 74)"/>
    <ellipse cx="132" cy="88" rx="4.2" ry="3" transform="rotate(-24 132 88)"/>
    <ellipse cx="188" cy="88" rx="4.2" ry="3" transform="rotate(24 188 88)"/>
  </g>

  <!-- 脸部浅色区 -->
  <path d="M160 96 C 196 96 220 122 220 152 C 220 180 194 196 160 196 C 126 196 100 180 100 152 C 100 122 124 96 160 96 Z"
        fill="#f3efff" opacity=".92"/>

  <!-- ============ 大眼睛 ============ -->
  <g>
    <ellipse cx="127" cy="150" rx="17" ry="21" fill="#3a2e5c"/>
    <ellipse cx="193" cy="150" rx="17" ry="21" fill="#3a2e5c"/>
    <circle cx="133" cy="141" r="6.5" fill="#ffffff"/>
    <circle cx="199" cy="141" r="6.5" fill="#ffffff"/>
    <circle cx="122" cy="158" r="3" fill="#ffffff" opacity=".8"/>
    <circle cx="188" cy="158" r="3" fill="#ffffff" opacity=".8"/>
    <!-- 睫毛 -->
    <g stroke="#3a2e5c" stroke-width="4" stroke-linecap="round">
      <path d="M108 136 l-7 -4"/>
      <path d="M212 136 l7 -4"/>
    </g>
  </g>

  <!-- 腮红 -->
  <ellipse cx="102" cy="172" rx="12" ry="7.5" fill="#f7a6a0" opacity=".85"/>
  <ellipse cx="218" cy="172" rx="12" ry="7.5" fill="#f7a6a0" opacity=".85"/>

  <!-- 鼻子 + 微笑 -->
  <path d="M154 176 q6 -5 12 0 q-2 8 -6 8 q-4 0 -6 -8 z" fill="#3a2e5c"/>
  <path d="M142 190 q18 16 36 0 q-6 14 -18 14 q-12 0 -18 -14 z" fill="#3a2e5c"/>
  <path d="M147 193 q13 9 26 0 q-5 8 -13 8 q-8 0 -13 -8 z" fill="#f27d93"/>

  <!-- ============ 红领巾 ============ -->
  <g stroke="#3a2e5c" stroke-width="7" stroke-linejoin="round">
    <path d="M108 196 C 128 210 192 210 212 196 C 218 210 214 224 202 232 C 172 244 148 244 118 232 C 106 224 102 210 108 196 Z"
          fill="#e0472e"/>
    <path d="M196 226 C 206 238 212 252 208 266 C 198 262 190 250 188 236 Z" fill="#c93a24"/>
  </g>
  <path d="M118 204 C 136 214 184 214 202 204" fill="none" stroke="#a52c18" stroke-width="5" stroke-linecap="round" opacity=".55"/>
</svg>
